name: Java Release
on:
  push:
    tags: ['java-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version
        required: true
        type: string
      publish:
        description: Publish to the selected registry from main after all checks pass
        type: boolean
        default: false
      registry:
        description: Package registry
        type: choice
        options: [github-packages, maven-central]
        default: github-packages
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: java-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    name: Validate and stage Java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      candidate-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/setup-sdk
      - name: Test CI and staging rules
        run: python3 -m unittest discover -s tests/ci -v
      - name: Install locked dependencies
        run: |
          npm ci --prefix sdks/java/tools/greenfield
      - name: Build and test exact revision
        run: make java-check
      - name: Verify dependency security and reviewed forks
        run: make security-java
      - name: Verify public API
        run: python3 scripts/verify-public-api.py --language java
      - name: Generate Gradle module metadata
        env:
          PUBLISH: ${{ inputs.publish && inputs.registry == 'maven-central' }}
        working-directory: sdks/java
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(-PpublicRelease); fi
          ./gradlew assemble generatePomFileForMavenJavaPublication generateMetadataFileForMavenJavaPublication --console=plain "${args[@]}"
      - name: Stage versioned artifacts and SHA256 checksums
        env:
          GITHUB_PACKAGES: ${{ inputs.publish && inputs.registry == 'github-packages' }}
          PUBLISH: ${{ inputs.publish && inputs.registry == 'maven-central' }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--public); fi
          if [[ "$GITHUB_PACKAGES" == true ]]; then args+=(--github-packages); fi
          python3 scripts/stage-release.py --language java "${args[@]}"
      - name: Save security evidence separately from the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/java.json
          if-no-files-found: error
          retention-days: 14
      - name: Save release candidate
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging/java/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.repository == 'RecycleFarm/recanet-sdk' && github.ref == 'refs/heads/main' && inputs.publish && inputs.registry == 'maven-central'
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate-id }}
          path: candidate
      - name: Sign and publish the verified Maven bundle
        env:
          VERSION: ${{ inputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.CENTRAL_GPG_PRIVATE_KEY }}
          CENTRAL_GPG_PASSPHRASE: ${{ secrets.CENTRAL_GPG_PASSPHRASE }}
        run: bash scripts/publish-central.sh "candidate/$VERSION"
  verify-public-install:
    needs: [stage, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate-id }}
          path: candidate
      - name: Resolve the Java SDK and its worker from Maven Central
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "candidate/$VERSION"
          group=$(jq -er '.package.groupId' manifest.json)
          artifact=$(jq -er '.package.artifactId' manifest.json)
          cache=$(mktemp -d)
          mvn --batch-mode --no-transfer-progress -Dmaven.repo.local="$cache" \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get -Dartifact="$group:$artifact:$VERSION"
          layout="${group//./\/}/$artifact/$VERSION"
          cmp "maven/$layout/$artifact-$VERSION.jar" "$cache/$layout/$artifact-$VERSION.jar"
          for path in "maven/$layout/"*; do
            curl --fail --silent --show-error --max-time 30 \
              "https://repo.maven.apache.org/maven2/$layout/${path##*/}" -o "$cache/published"
            cmp "$path" "$cache/published"
          done
  publish-github-packages:
    if: github.repository == 'RecycleFarm/recanet-sdk' && github.ref == 'refs/heads/main' && inputs.publish && inputs.registry == 'github-packages'
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate-id }}
          path: candidate
      - name: Publish and resolve the verified Maven artifacts
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          GITHUB_PACKAGES_USER: ${{ github.actor }}
          REGISTRY: https://maven.pkg.github.com/recyclefarm/recanet-sdk
        run: |
          cd "candidate/$VERSION"
          sha256sum -c SHA256SUMS
          jq -e --arg version "$VERSION" '.publishReady and .version == $version' manifest.json
          group=$(jq -er '.package.groupId' manifest.json)
          artifact=$(jq -er '.package.artifactId' manifest.json)
          layout="${group//./\/}/$artifact/$VERSION"
          stem="$artifact-$VERSION"
          base="maven/$layout/$stem"
          temp=$(mktemp -d)
          cat > "$temp/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>recanet-github</id>
                <username>${env.GITHUB_PACKAGES_USER}</username>
                <password>${env.GITHUB_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          mvn --batch-mode --no-transfer-progress --settings "$temp/settings.xml" \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            "-DrepositoryId=recanet-github" "-Durl=$REGISTRY" \
            "-DpomFile=$base.pom" "-Dfile=$base.jar" \
            "-Dfiles=$base-javadoc.jar,$base.module,greenfield-worker-linux-x64.tar.gz" \
            "-Dtypes=jar,module,tar.gz" "-Dclassifiers=javadoc,,greenfield-worker-linux-x64"
          cat > "$temp/pom.xml" <<XML
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.recyclefarm.verification</groupId>
            <artifactId>maven-consumer</artifactId>
            <version>1</version>
            <repositories>
              <repository><id>recanet-github</id><url>$REGISTRY</url></repository>
            </repositories>
            <dependencies>
              <dependency><groupId>$group</groupId><artifactId>$artifact</artifactId><version>$VERSION</version></dependency>
            </dependencies>
          </project>
          XML
          mvn --batch-mode --no-transfer-progress --settings "$temp/settings.xml" \
            --file "$temp/pom.xml" "-Dmaven.repo.local=$temp/repository" \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:resolve
          cmp "$base.jar" "$temp/repository/$layout/$stem.jar"
          for suffix in .pom -javadoc.jar .module -greenfield-worker-linux-x64.tar.gz; do
            local_file="$base$suffix"
            if [[ "$suffix" == -greenfield-worker-linux-x64.tar.gz ]]; then
              local_file=greenfield-worker-linux-x64.tar.gz
            fi
            curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 \
              --user "$GITHUB_PACKAGES_USER:$GITHUB_PACKAGES_TOKEN" \
              "$REGISTRY/$layout/$stem$suffix" -o "$temp/download"
            cmp "$local_file" "$temp/download"
          done
