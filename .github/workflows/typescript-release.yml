name: TypeScript Release
on:
  push:
    tags: ['typescript-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version
        required: true
        type: string
      publish:
        description: Publish to the selected registry from main after all checks pass
        type: boolean
        default: false
      registry:
        description: Package registry
        type: choice
        options: [github-packages, npmjs]
        default: github-packages
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: typescript-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    uses: ./.github/workflows/typescript-native.yml
  stage:
    needs: native
    name: Validate and stage TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      candidate-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/setup-sdk
      - name: Test CI and staging rules
        run: python3 -m unittest discover -s tests/ci -v
      - name: Install locked dependencies
        run: |
          npm ci --prefix sdks/typescript
          npm ci --prefix sdks/typescript/tools/greenfield
      - name: Collect both native prebuilds from this workflow run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: recanet-native-*
          path: sdks/typescript/prebuilds/
          merge-multiple: true
      - name: Build and test exact revision
        run: make typescript-check 2>&1 | tee typescript-check.log
      - name: Verify dependency security and reviewed forks
        run: make security-typescript
      - name: Verify public API
        run: python3 scripts/verify-public-api.py --language typescript
      - name: Stage versioned artifacts and SHA256 checksums
        env:
          GITHUB_PACKAGES: ${{ inputs.publish && inputs.registry == 'github-packages' }}
          PUBLISH: ${{ inputs.publish && inputs.registry == 'npmjs' }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--public); fi
          if [[ "$GITHUB_PACKAGES" == true ]]; then args+=(--github-packages); fi
          python3 scripts/stage-release.py --language typescript "${args[@]}"
      - name: Save security evidence separately from the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/typescript.json
          if-no-files-found: error
          retention-days: 14
      - name: Save release candidate
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging/typescript/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.repository == 'RecycleFarm/recanet-sdk' && github.ref == 'refs/heads/main' && inputs.publish && inputs.registry == 'npmjs'
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate-id }}
          path: candidate
      - name: Publish the verified tarball
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "candidate/$VERSION"
          sha256sum -c SHA256SUMS
          jq -e --arg version "$VERSION" '.publishReady and .version == $version and .package.name == "@recyclefarm/recanet-sdk"' manifest.json
          tarball="recyclefarm-recanet-sdk-$VERSION.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          status=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/npm-metadata.json" -w '%{http_code}' \
            "https://registry.npmjs.org/@recyclefarm%2frecanet-sdk/$VERSION")
          case "$status" in
            200)
              jq -e --arg integrity "$integrity" '.dist.integrity == $integrity' "$RUNNER_TEMP/npm-metadata.json"
              exit 0 ;;
            404) ;;
            *) echo "npmjs metadata request returned HTTP $status" >&2; exit 1 ;;
          esac
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          tag=latest
          if [[ "${VERSION%%+*}" == *-* ]]; then tag=next; fi
          npm publish "./$tarball" --registry=https://registry.npmjs.org --access=public --tag="$tag"
  verify-public-install:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Install from npmjs and run the native journal
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "$(mktemp -d)"
          npm install --registry=https://registry.npmjs.org --no-audit --no-fund "@recyclefarm/recanet-sdk@$VERSION"
          node --input-type=module <<'JS'
          import { FileOperationJournal } from '@recyclefarm/recanet-sdk';
          const journal = new FileOperationJournal('./journal');
          await journal.withLock('public-install', async () => journal.store('public-install', { ok: true }));
          if (!(await journal.load('public-install'))?.ok) throw new Error('Native journal smoke test failed');
          JS
  publish-github-packages:
    if: github.repository == 'RecycleFarm/recanet-sdk' && github.ref == 'refs/heads/main' && inputs.publish && inputs.registry == 'github-packages'
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@recyclefarm'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate-id }}
          path: candidate
      - name: Publish the verified tarball to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cd "candidate/$VERSION"
          sha256sum -c SHA256SUMS
          jq -e --arg version "$VERSION" '.publishReady and .version == $version' manifest.json
          name=$(jq -er '.package.name' manifest.json)
          tarball="recyclefarm-${name#*/}-$VERSION.tgz"
          tag=latest
          if [[ "${VERSION%%+*}" == *-* ]]; then tag=next; fi
          npm publish "./$tarball" --registry=https://npm.pkg.github.com --tag="$tag" --ignore-scripts
      - name: Verify installation from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CC: /recanet-no-compiler
          RECANET_NODE_INCLUDE: /recanet-no-headers
        run: |
          name=$(jq -er '.package.name' "candidate/$VERSION/manifest.json")
          cd "$(mktemp -d)"
          npm install --ignore-scripts --no-audit --no-fund "$name@$VERSION"
          PACKAGE_NAME="$name" node --input-type=module <<'JS'
          const { FileOperationJournal } = await import(process.env.PACKAGE_NAME);
          const journal = new FileOperationJournal('./journal');
          await journal.withLock('registry-install', async () => journal.store('registry-install', { ok: true }));
          if (!(await journal.load('registry-install'))?.ok) throw new Error('Native journal smoke test failed');
          JS
