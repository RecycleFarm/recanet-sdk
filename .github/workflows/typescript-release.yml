name: TypeScript Release Candidate
on:
  push:
    tags: ['typescript-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to stage; no publication
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: typescript-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    name: Validate and stage TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/setup-sdk
      - name: Test CI and staging rules
        run: python3 -m unittest discover -s tests/ci -v
      - name: Install locked dependencies
        run: |
          npm ci --prefix sdks/typescript
          npm ci --prefix sdks/typescript/tools/greenfield
      - name: Build and test exact revision
        run: make typescript-check 2>&1 | tee typescript-check.log
      - name: Verify public API
        run: python3 scripts/verify-public-api.py --language typescript
      - name: Stage versioned artifacts and SHA256 checksums
        run: python3 scripts/stage-release.py --language typescript
      - name: Save internal release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging/typescript/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize publication state
        run: echo 'Internal candidate only. No package publication was performed.' >> "$GITHUB_STEP_SUMMARY"
