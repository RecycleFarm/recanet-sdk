name: TypeScript native prebuilds
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    name: Build and test native locks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Verify supported OS and CPU
        run: |
          node -e 'const expected = process.env.RUNNER_OS === "macOS" ? "darwin/arm64" : "linux/x64"; if (`${process.platform}/${process.arch}` !== expected) throw new Error(`Expected ${expected}`);'
      - name: Build native module from this revision
        run: |
          npm ci --prefix sdks/typescript
          npm --prefix sdks/typescript run build
      - name: Test actual OS locks and Java interoperability
        run: node --test sdks/typescript/tests/posix-lock.test.mjs
      - name: Save platform prebuild and source digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recanet-native-${{ matrix.os }}
          path: sdks/typescript/prebuilds/
          if-no-files-found: error
          retention-days: 7
