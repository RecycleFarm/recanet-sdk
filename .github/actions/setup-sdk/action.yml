name: SDK toolchains
description: Configure the JDK and Node required by both SDKs and native tests
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.23.5'
        package-manager-cache: false
    - name: Verify native build headers
      shell: bash
      run: |
        node --version
        java -version
        node -e 'const fs = require("node:fs"); const path = require("node:path"); fs.accessSync(path.join(path.dirname(process.execPath), "../include/node/node_api.h"));'
